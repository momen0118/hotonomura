t":"……あれも、だいぶ前に。"},{"c":"おばちゃん","t":"早いねえ。うちのホットケーキ粉はまだ現役だよ。"}]},{"id":"amb_shop_gag_kickboard","kind":"ambient","place":"shop","script":[{"bg":"shop"},{"c":"おばちゃん","t":"電気のキックボードみたいなの、流行ってるんだろ。"},{"c":"{{name}}","t":"たまに見ます。"},{"c":"おばちゃん","t":"こっちで乗ったら田んぼに落ちるね。"}]},{"id":"amb_shop_gag_tapioca","kind":"ambient","place":"shop","if":"day>=8","comment":"必ず後半(Day 8以降)に出すこと。ゲームの主題文がおばちゃんの世間話に埋まる位置なので、序盤に消費しない。","script":[{"bg":"shop"},{"c":"おばちゃん","t":"タピオカってあれかい、結局なんだったんだい。"},{"c":"{{name}}","t":"……なんだったんでしょうね。"}]},{"id":"amb_river_mizukiri","kind":"ambient","place":"river","if":"met_natsu && natsu_today","tags":["place:river"],"script":[{"bg":"river"},{"c":"ナツ","t":"水切りやろう。負けたほうがジュースね。"},{"n":"ナツの石は九回はねた。九回。"},{"n":"おれの石は、三回で沈んだ。"},{"c":"ナツ","t":"石の選び方から教えたげようか？ 年上だし。"},{"n":"ジュースは、おごってもらった。年上だし、だそうだ。"},{"diary":{"fact":"水切りで九回対三回で負けた。","blackout":"水切り","feeling":"ずるい。","tags":["fun:mizukiri"]}}]},{"id":"amb_river_taro","kind":"ambient","place":"river","if":"met_taro","tags":["taro"],"script":[{"bg":"river"},{"n":"川原に、タロがいた。"},{"n":"向こうが先に気づいて、しっぽが先に動いた。"},{"n":"挨拶をして、頭を撫でた。それだけの用事だった。"},{"n":"それだけの用事で、けっこう満足だった。"},{"comment":"黒塗り規則v2の本命。「■■がいた。おぼえててくれた。」——思い出せないものが、こっちを覚えていてくれた。","diary":{"fact":"タロがいた。","blackout":"タロ","feeling":"おぼえててくれた。","tags":["taro"]}}]},{"id":"amb_house_shimbun","kind":"ambient","place":"house","comment":"茂は「でかいイベントなし、日常でちょこちょこ見かける」枠。日記行なし。","script":[{"bg":"house"},{"n":"縁側で、じいちゃんが新聞を読んでいた。"},{"n":"隣に座ったら、テレビ欄のページだけ、こっちに向けてくれた。"},{"n":"無言だった。テレビ欄は、ありがたかった。"}]},{"id":"amb_house_tomato","kind":"ambient","place":"house","script":[{"bg":"house"},{"n":"朝、じいちゃんが畑からトマトを持って帰ってきた。"},{"c":"じいちゃん","t":"……食うか。"},{"n":"水で洗っただけのトマトは、あたたかかった。"},{"n":"トマトって、あたたかいのか。"},{"diary":{"fact":"じいちゃんのトマトはあたたかかった。","blackout":"じいちゃんのトマト","tags":["fun:tomato"]}}]},{"id":"amb_house_keitora","kind":"ambient","place":"house","comment":"道での出来事。移動そのものを場所として持っていないので、家のコマの受け皿に入れてある。日記行なし。","script":[{"bg":"road","here":"道"},{"n":"じいちゃんの軽トラが、道で停まって、乗せてくれた。"},{"n":"ラジオがついていた。演歌だった。"},{"n":"じいちゃんは歌わない。"},{"n":"指だけが、ハンドルの上で、拍子をとっていた。"}]},{"id":"amb_house_watch","kind":"ambient","place":"house","if":"item:watch","once":true,"comment":"腕時計所持周回のみ・一度きり。茂に「いいもん持ってるな」を言わせないこと(ナツ/ツリさんの対の構文なので薄めない)。","script":[{"bg":"house"},{"n":"縁側で、腕時計のねじを巻いていた。"},{"n":"巻かないと止まる時計だと、持ってくる前に母に教わった。"},{"n":"気づいたら、じいちゃんが隣で見ていた。"},{"c":"じいちゃん","t":"……手入れ、してるのか。"},{"c":"{{name}}","t":"母さんのほうの、じいちゃんの。"},{"c":"じいちゃん","t":"…………そうか。"},{"n":"じいちゃんは、それ以上聞かなかった。"},{"n":"立ち上がるときに、ひとこと。"},{"c":"じいちゃん","t":"……動いてるうちは、大事にな。"},{"diary":{"fact":"じいちゃんが、じいちゃんの時計をほめた。","blackout":"じいちゃんの時計","tags":["fun:watch"]}}]},{"id":"amb_park_radio","kind":"ambient","place":"park","slot":"morning","art_note":"列の人数は将来、周回の支払い状況と連動して減らす。人数はデータで持つこと。","script":[{"bg":"park"},{"n":"朝の公園に、ラジオ体操の列があった。"},{"n":"子どもと、大人と、おばあちゃんたち。"},{"n":"端に混ざったら、となりのおばあちゃんが判子をくれた。"},{"n":"カードは、持っていないのに。"},{"diary":{"fact":"ラジオ体操に混ざった。判子だけもらった。","blackout":"ラジオ体操","tags":["fun:radio"]}}]},{"id":"amb_park_yuyake","kind":"ambient","place":"park","slot":"evening","script":[{"bg":"park_evening"},{"n":"夕方の公園から見た空が、ぜんぶオレンジだった。"},{"n":"おれのとこの夕焼けより、面積が広い。"},{"n":"理由はわかる。さえぎるものがないからだ。"},{"n":"わかるけど、すごいものはすごい。"},{"diary":{"fact":"公園で夕焼けを見た。","blackout":"夕焼け","feeling":"すごかった。","tags":["fun:yuyake"]}}]},{"id":"amb_park_semi","kind":"ambient","place":"park","script":[{"bg":"park"},{"n":"むこうの木で、村の子が蝉を素手で捕っていた。"},{"n":"近づく。とまる。かぶせる。三秒だった。"},{"n":"網より速い素手が、この世にはある。"}]},{"id":"amb_river_ishizumi","kind":"ambient","place":"river","tags":["place:river"],"script":[{"bg":"river"},{"n":"平らな石を選んで、積んだ。六段で崩れた。"},{"n":"少し上流に、誰かが先に積んだ塔があった。"},{"n":"九段だった。負けた。"},{"diary":{"fact":"石積みで、知らないだれかに負けた。","blackout":"石積み","tags":["fun:ishizumi"]}}]},{"id":"amb_river_kataashi","kind":"ambient","place":"river","tags":["place:river"],"script":[{"bg":"river"},{"n":"濡れないように跳んだ石が、動いた。"},{"n":"右足だけ、川に落ちた。"},{"n":"靴は夕方まで乾かなかった。片足だけ、ずっと重かった。"},{"diary":{"fact":"川で右足だけぬれた。","blackout":"川","feeling":"最悪。","tags":["fun:kawa"]}}]},{"id":"amb_river_sasabune","kind":"ambient","place":"river","if":"!natsu_today","tags":["place:river"],"comment":"「手が知っていた」は撤回(FABLE_ANSWERS_10 §2.3)。ナツ不在時のみ(第9便Q5)。ソラひとりの情景。","script":[{"bg":"river"},{"n":"笹の葉で舟が折れると、なにかで見た気がする。"},{"n":"三回失敗して、四回目が、舟っぽくなった。"},{"n":"流した。舟は、曲がり角で沈んだ。"}]},{"id":"amb_himawari_hachi","kind":"ambient","place":"himawari","tags":["place:himawari"],"script":[{"bg":"himawari"},{"n":"ひまわりには、蜂がいた。働いていた。"},{"n":"こわいので、道をゆずった。"},{"n":"むこうは、こっちに興味がなかった。"}]},{"id":"amb_himawari_sekurabe","kind":"ambient","place":"himawari","tags":["place:himawari"],"script":[{"bg":"himawari"},{"n":"いちばん高いひまわりを探した。"},{"n":"どれも、おれより高かった。"},{"n":"ぜんぶに負けた。"},{"diary":{"fact":"ひまわりぜんぶに背で負けた。","blackout":"ひまわり","tags":["fun:sekurabe"]}}]},{"id":"pre_river_taro_lost","kind":"prelude","place":"river","if":"lost:taro","once":true,"comment":"体の記憶の空振り。理由の説明・独白の続きは一切付けない。初回のみ(毎回出すとギャグになる)。本文の■化はしない——世界は素知らぬ顔を貫く。","script":[{"bg":"river","here":"川原"},{"n":"川原に着いて、しゃがんだ。なんでしゃがんだのか、わからなかった。膝の高さに、手を出していた。"}]},{"id":"tooriame_body","kind":"fixed","place":"none","comment":"通り雨の思い出弾(fun:tooriame・FABLE_ANSWERS_19b §4)。屋外コマの各所から include される。ナツ在(natsu_today)が前提。軒下・前髪ぺったぺたで完結し、家には発展しない(家への入口は「にわか雨」niwaka_ame へ分離。tooriameが食われてもナツの家→ノート分岐→ナツEDの経路は閉じない)。tooriame_done を立てて一周に一回に制限。にわか雨発生周とは同日排他(ラッパー側の !niwaka_done が担う)。","script":[{"n":"急に、あたりが暗くなった。"},{"c":"ナツ","t":"……くる。"},{"c":"{{name}}","t":"なにが。"},{"n":"きた。"},{"n":"バケツをひっくり返した、という表現は、控えめだと思った。"},{"n":"いちばん近い軒下まで、二人で走った。間に合わなかった。"},{"n":"軒下で、ナツが笑いだした。"},{"c":"ナツ","t":"{{name}}、前髪。ぺったぺた。"},{"c":"{{name}}","t":"ナツもだよ。"},{"n":"雨は、十分で上がった。"},{"n":"上がったあとの道は、土のにおいがした。"},{"set":{"tooriame_done":true}},{"diary":{"fact":"通り雨にやられた。前髪がぺったぺたになった。","blackout":"通り雨","tags":["fun:tooriame"]}},{"diary":{"feeling":"ちょっと笑った。"}}]},{"id":"amb_tooriame_park","kind":"ambient","place":"park","if":"day>=9 && natsu_today && !tooriame_done && !niwaka_done","script":[{"bg":"park"},{"include":"tooriame_body"}]},{"id":"amb_tooriame_river","kind":"ambient","place":"river","if":"day>=9 && natsu_today && !tooriame_done && !niwaka_done","tags":["place:river"],"script":[{"bg":"river"},{"include":"tooriame_body"}]},{"id":"amb_tooriame_himawari","kind":"ambient","place":"himawari","if":"day>=9 && natsu_today && !tooriame_done && !niwaka_done","tags":["place:himawari"],"script":[{"bg":"himawari"},{"include":"tooriame_body"}]},{"id":"amb_park_suirin","kind":"ambient","place":"park","if":"item:acryl && natsu_today && day>=6","once":true,"comment":"すいりん似(FABLE_ANSWERS_11 §2.5)。アクスタ所持+ナツ在+Day 6以降・一回きり。日記行なし。","script":[{"bg":"park"},{"n":"ナツが、アクスタをじっと見ていた。"},{"c":"ナツ","t":"……ねえ。すいりんって、ナツに似てない？"},{"c":"{{name}}","t":"は？"},{"n":"言われて、見た。アクスタと、ナツを、交互に。"},{"n":"日焼けはしていない。髪も違う。でも——"},{"c":"{{name}}","t":"……似て、なくは、ない。"},{"c":"ナツ","t":"でしょ。"},{"n":"ナツは、なぜか勝った顔をした。"},{"n":"どこがどう似ているのかは、最後まで言葉にならなかった。"}]},{"id":"amb_teibou_tsurisan","kind":"ambient","place":"teibou","comment":"堤防の日常・ツリさん観察(FABLE_ANSWERS_13 §5)。タグなし。","script":[{"bg":"river"},{"n":"堤防に、今日もツリさんがいた。"},{"n":"竿は、動いていなかった。"},{"n":"挨拶をしたら、帽子が、すこしだけ動いた。"},{"n":"返事だと、思うことにした。"}]},{"id":"amb_teibou_tsuri","kind":"ambient","place":"teibou","if":"natsu_today","script":[{"bg":"river"},{"n":"ナツに竿を借りて、釣りをした。"},{"n":"三十分で、あたりは一回。あわせられなかった。"},{"c":"ナツ","t":"釣りはね、待つのが本体なの。"},{"n":"待つのが本体なら、おれはずっと本体をやっていた。"},{"diary":{"fact":"堤防で釣りをした。一回もつれなかった。","blackout":"釣り","tags":["fun:tsuri"]}}]},{"id":"amb_teibou_yuu","kind":"ambient","place":"teibou","slot":"evening","comment":"静かな弾(タグなし)。","script":[{"bg":"river"},{"n":"夕方の堤防は、風がぬるかった。"},{"n":"川は、光って、流れているだけだった。"},{"n":"流れているだけのものを、けっこう長いこと見ていた。"}]},{"id":"amb_teibou_bucket","kind":"ambient","place":"teibou","slot":"evening","if":"loop>=2","comment":"2周目以降限定・低確率の静かな弾(FABLE_ANSWERS_13 §5)。追撃独白・書き足しなし(見ただけの光景)。","script":[{"bg":"river"},{"n":"帰りぎわ、ツリさんが立ち上がるのが見えた。"},{"n":"バケツを持って、堤防を降りて、山のほうへ歩いていく。"},{"n":"釣れていないのに、バケツを、空けに行くらしい。"}]},{"id":"amb_compass_spin","kind":"ambient","place":"teibou","if":"item:band","once":true,"comment":"コンパスイベント(a) 針が回る(FABLE_ANSWERS_16a §4)。多機能腕バンド所持時・堤防などでランダ 。"}}]},{"id":"d06_hall_meet","kind":"fixed","day":6,"place":"matsuri","if":"lost:fun:matsuri","comment":"FABLE_ANSWERS_15a・祭り消滅周のDay6(祭りがあったはずの日付)。FABLE_ANSWERS_18 §10.2 で通算1回→毎周発生に変更(既読スキップで吸収)。広場の恒常調べ(matsuri_hall_photo)は廃止。natsu_today はこの日だけ強制true。ナツの「やってたんだって」は伝聞のまま。「人がいないもん。」は言い切り。「提灯のかたちを、どこかで見た気がした。」は体の記憶系列の三つ目。","script":[{"bg":"matsuri","here":"広場"},{"c":"ナツ","t":"今日、なんかヒマだね。"},{"c":"{{name}}","t":"いつもヒマじゃん。"},{"c":"ナツ","t":"失礼な。……あ、そうだ。おもしろいもの見せたげる。"},{"bg":"shrine","here":"集会所"},{"n":"連れていかれたのは、広場の集会所だった。"},{"n":"壁に、白黒の写真が飾ってあった。"},{"c":"ナツ","t":"これ。昔はうちの村も、お祭りやってたんだって。ほら、屋台とか出て。"},{"c":"{{name}}","t":"へえ。……もう、やんないの？"},{"c":"ナツ","t":"やんない。人がいないもん。"},{"n":"写真の中の広場は、にぎやかだった。"},{"n":"提灯のかたちを、どこかで見た気がした。"},{"n":"気のせいだと、思う。"},{"diary":{"fact":"集会所で、昔の祭りの写真を見た。"}}]}]`),de=t({default:()=>fe}),fe=[{id:`d07_okuribi`,kind:`fixed`,day:7,slot:`evening`,place:`house`,art_note:`迎え火(Day 4)と同一構図・同一場所で描く。「おなじ組み方で、おなじ場所」を絵でも反復。`,comment:`不穏は「帰れるなら、いいじゃん」の一往復と「そっか」の余白のみ。ナツの内面描写・表情の意味づけは一切禁止。「いつもの顔だった」まで。`,script:[{bg:`engawa_night`,here:`家の前`},{n:`夕方、じいちゃんが、また木を組んだ。`},{n:`おなじ組み方で、おなじ場所だった。`},{c:`ばあちゃん`,t:`今度はね、帰り道を照らしてあげるの。`},{n:`火がついた。`},{n:`来た日とおなじ火のはずなのに、なんとなく、小さく見えた。`},{n:`ナツが、また道のむこうから歩いてきた。`},{n:`おなじように、隣に立った。`},{c:`{{name}}`,t:`……みんな帰っちゃうの、ちょっとさみしいね。`},{c:`ナツ`,t:`…………帰れるなら、いいじゃん。`},{n:`ナツは、火じゃなくて、道のほうを見ていた。`},{n:`え、と聞き返す前に、ナツはもういつもの顔だった。`},{c:`ナツ`,t:`ね、{{name}}は、帰りたい？`},{c:`{{name}}`,t:`え？ ……まあ、帰るけど。あと一週間で。`},{c:`ナツ`,t:`そっか。`},{n:`そっか、のあとは、火の音だけだった。`},{n:`火の音って、あるんだ、と思った。`},{comment:`この日は写真スロット自体を空にする。糊の跡は出さない——捧げによる欠損と、撮らなかった空白は見た目で区別がつくこと。`,photo:{id:`d07_none`,caption:`写真はない。なんとなく、撮らなかった。`,none:!0}},{diary:{fact:`玄関の前で送り火をたいた。`,blackout:`送り火`,tags:[`fun:okuribi`]}},{diary:{fact:`今日でお盆が終わった。`}},{diary:{feeling:`なんか、しずかだった。`}}]}],pe=t({default:()=>me}),me=[{id:`d08_morning`,kind:`fixed`,day:8,slot:`morning`,place:`house`,comment:`Day 8 台風(FABLE_ANSWERS_8 §3)。終日固定・在宅。不穏は最終行(夕方)のみ。以降の追撃・独白の続きは禁止。「Day 1の切れた電話との接続」はテキストで示唆しない。

だ。`},{c:`ナツ`,t:`{{name}}、ゲームやる？ 対戦の、古いやつあるよ。`},{n:`ナツは、ふつうだった。`},{n:`隠す感じが、まるでなかった。`},{n:`古い対戦ゲームは、画面が二つに割れるやつだった。`},{n:`対戦の相手は、線の向こうにしかいないと思っていた。`},{n:`隣にいた。`},{n:`三回やって、三回負けた。`},{n:`ナツが、おかわりを取りに下へ降りていった。`},{n:`部屋に、ノートの塔とふたりきりになった。`},{n:`いちばん新しい番号のノートが、すこしだけ飛び出していた。`},{choice:[{label:`読む`,set:{read_note:!0},lines:[{n:`手が、伸びた。`},{n:`いちばん新しいノートを、開いた。`},{n:`おれの名前が、あった。`},{n:`『{{name}}。六年生。八月十日に来る。』`},{n:`『商店の前で会うこと。距離を近くすること。』`},{n:`『村を好きにさせること。』`},{n:`ページを、さかのぼった。`},{n:`知らない名前があった。もっと前には、べつの名前。`},{n:`どのページにも、同じことが書いてあった。`},{n:`好きにさせること。代わりになってもらうこと。`},{n:`ところどころ、黒く塗られていた。`},{n:`おれの日記と、同じ黒だった。`},{n:`いちばん古い番号の表紙は、日に焼けて白くなっていた。`},{n:`階段の音がした。`},{n:`ノートを、戻した。`},{n:`戻した場所が正しかったか、わからなかった。`},{c:`ナツ`,t:`おまたせ。……ん？ どうした？`},{c:`{{name}}`,t:`……なんでもない。`},{n:`なんでもない顔が、できていたかは、わからない。`}]},{label:`読まない`,lines:[{n:`手が、伸びかけた。`},{n:`……やめた。`},{n:`読んだら、なにかが変わる気がした。`},{n:`なにが、かは、わからない。`},{n:`わからないままで、いたかった。`},{n:`階段の音がして、ナツが戻ってきた。`},{c:`ナツ`,t:`なに、ぼーっとして。`},{c:`{{name}}`,t:`……いや。なんも。`}]}]},{diary:{fact:`ナツの家で雨宿りした。ゲームで三回負けた。`,blackout:`ナツの家`,tags:[`fun:natsu_ie`]}}]},{id:`natsu_after_read1`,kind:`prelude`,place:`park`,if:`read_note && natsu_today`,once:!0,comment:`ノートを読んだ周の差分・その1(FABLE_ANSWERS_17 §1)。翌日以降の任意のナツイベントの冒頭に一度。ナツが読まれたことに気づいている描写は入れない。理由の説明禁止。日記なし。`,script:[{bg:`park`},{n:`ナツは、いつもどおりだった。`},{n:`いつもどおりすぎる、と思ってから、そう思ってしまう自分に気づいた。`},{c:`ナツ`,t:`{{name}}、川いこ。`},{n:`誘われて、行った。`},{n:`遊んで、笑った。`},{n:`笑いながら、手順、という言葉が、頭のすみにあった。`}]},{id:`natsu_after_read2`,kind:`prelude`,place:`river`,if:`read_note && day>=12 && natsu_today`,once:!0,comment:`ノートを読んだ周の差分・その2(FABLE_ANSWERS_17 §1 / 17a §1)。周の後半に一回。『子どもみたい』=計画の外で遊ぶナツ。気づいている描写は入れない。日記なし。`,script:[{bg:`river`},{c:`ナツ`,t:`……{{name}}、あのさ。`},{c:`{{name}}`,t:`ん？`},{c:`ナツ`,t:`んーん。やっぱなんでもない。あそぼ。`},{n:`その日のナツは、なんだか、いつもより子どもみたいだった。`}]},{id:`amb_natsu_tokai`,kind:`ambient`,place:`park`,if:`day>=3 && natsu_today`,comment:`ナツの都会質問(FABLE_ANSWERS_17a §2)。ナツの憧れの向きは常に外(バス・電車・都会)。由来は語らない。日記行なし。`,script:[{bg:`park`},{c:`ナツ`,t:`ねえ、{{name}}のとこって、電車、何分おきに来る？`},{c:`{{nam
