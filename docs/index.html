nd":"fixed","day":6,"place":"matsuri","script":[{"bg":"road","here":"帰り道"},{"n":"帰り道は、提灯が遠くなるにつれて、暗くなった。"},{"c":"ナツ","t":"ね、楽しかったでしょ。"},{"c":"{{name}}","t":"……まあ。"},{"c":"ナツ","t":"まあ、じゃないでしょ。"},{"c":"{{name}}","t":"楽しかった。"},{"c":"ナツ","t":"よし。"},{"n":"よし、ってなんだ。"},{"n":"でも、悪い気はしなかった。"},{"diary":{"feeling":"楽しかった。"}}]}]`),de=t({default:()=>fe}),fe=[{id:`d07_okuribi`,kind:`fixed`,day:7,slot:`evening`,place:`house`,art_note:`迎え火(Day 4)と同一構図・同一場所で描く。「おなじ組み方で、おなじ場所」を絵でも反復。`,comment:`不穏は「帰れるなら、いいじゃん」の一往復と「そっか」の余白のみ。ナツの内面描写・表情の意味づけは一切禁止。「いつもの顔だった」まで。`,script:[{bg:`engawa_night`,here:`家の前`},{n:`夕方、じいちゃんが、また木を組んだ。`},{n:`おなじ組み方で、おなじ場所だった。`},{c:`フミ`,t:`今度はね、帰り道を照らしてあげるの。`},{n:`火がついた。`},{n:`来た日とおなじ火のはずなのに、なんとなく、小さく見えた。`},{n:`ナツが、また道のむこうから歩いてきた。`},{n:`おなじように、隣に立った。`},{c:`{{name}}`,t:`……みんな帰っちゃうの、ちょっとさみしいね。`},{c:`ナツ`,t:`…………帰れるなら、いいじゃん。`},{n:`え、と聞き返す前に、ナツはもういつもの顔だった。`},{c:`ナツ`,t:`ね、{{name}}は、帰りたい？`},{c:`{{name}}`,t:`え？ ……まあ、帰るけど。あと一週間で。`},{c:`ナツ`,t:`そっか。`},{n:`そっか、のあとは、火の音だけだった。`},{n:`火の音って、あるんだ、と思った。`},{comment:`この日は写真スロット自体を空にする。糊の跡は出さない——捧げによる欠損と、撮らなかった空白は見た目で区別がつくこと。`,photo:{id:`d07_none`,caption:`写真はない。なんとなく、撮らなかった。`,none:!0}},{diary:{fact:`玄関の前で送り火をたいた。`,blackout:`送り火`,tags:[`fun:okuribi`]}},{diary:{fact:`今日でお盆が終わった。`}},{diary:{feeling:`なんか、しずかだった。`}}]}],pe=t({default:()=>me}),me=[{id:`d08_morning`,kind:`fixed`,day:8,slot:`morning`,place:`house`,comment:`Day 8 台風(FABLE_ANSWERS_8 §3)。終日固定・在宅。不穏は最終行(夕方)のみ。以降の追撃・独白の続きは禁止。「Day 1の切れた電話との接続」はテキストで示唆しない。`,script:[{bg:`house`,here:`じいちゃんの家`},{n:`雨の音で、目が覚めた。`},{n:`テレビが、台風だと言っていた。ここに来て、テレビを真剣に見たのは初めてだった。`},{diary:{fact:`台風だった。一日、家にいた。`}},{n:`じいちゃんとばあちゃんは、朝から雨戸を閉めて回った。`},{n:`手伝った。雨戸というものを、閉めるのは初めてだった。`},{n:`最後の一枚がはまると、家の中が、昼なのに夜になった。`},{n:`家が、壁になった。`},{photo:{id:`d08_amado`,caption:`雨戸のすきまから撮った外。ぜんぶ灰色。`}},{c:`{{name}}`,t:`(……台風、学校がある日に来てくれればいいのに。)`,thought:!0},{n:`こっちに来てまで来なくていい。そういうところだぞ、台風。`},{diary:{fact:`雨戸をしめたら、昼が夜になった。`,blackout:`雨戸`,tags:[`fun:amado`]}}]},{id:`d08_noon`,kind:`fixed`,day:8,slot:`noon`,place:`house`,comment:`フミの「昔っ
